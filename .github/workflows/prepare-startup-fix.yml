name: Prepare Android startup fix
on:
  push:
    branches: [feat/glass-hourglass-ui]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve and lock platform dependencies
        run: flutter pub get
      - name: Format all Dart source
        run: dart format lib test integration_test test_driver
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Publish formatted source and dependency lock
        env:
          PREPARE_BASE_SHA: ${{ github.sha }}
          PREPARE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$PREPARE_BRANCH" = "feat/glass-hourglass-ui"
          git add lib test integration_test test_driver pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git fetch origin "$PREPARE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PREPARE_BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format startup fix and lock platform dependencies"
          git push origin "HEAD:$PREPARE_BRANCH"
