name: Temporary Phase 2.1 formatting
on:
  push:
    branches: [feat/phase-2-1-local-data-safety]
permissions:
  contents: write
concurrency:
  group: phase-2-1-formatting
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-2-1-local-data-safety
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - name: Commit formatted sources and resolved dependency lock
        run: |
          git add lib test pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format sources and lock dependencies"
          git push origin HEAD:feat/phase-2-1-local-data-safety
