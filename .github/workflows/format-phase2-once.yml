name: Format Phase 2 sources once

on:
  push:
    branches:
      - feat/phase-2-local-time-records

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-2-local-time-records
          fetch-depth: 0

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Phase 2 Dart sources"
          git push origin HEAD:feat/phase-2-local-time-records
