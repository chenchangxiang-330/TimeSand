name: Temporary cloud UI refresh

on:
  push:
    branches: [feat/glass-hourglass-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timesand-ui-cloud-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Prepare coastal scene and verify real UI
    if: github.ref == 'refs/heads/feat/glass-hourglass-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install preview renderer and screenshot fonts
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk fonts-roboto

      - name: Prepare the pinned, bundled coastal photograph
        run: python tool/prepare_coastal_photo.py

      - name: Upload processed scene and source attribution
        uses: actions/upload-artifact@v4
        with:
          name: timesand-coastal-scene
          path: |
            assets/scenes/coastal-sunrise.jpg
            assets/scenes/photo-source.json
          if-no-files-found: error
          retention-days: 3

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Print actual SDK versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Render actual phone and desktop widgets
        env:
          RUN_UI_SCREENSHOTS: 'true'
        run: flutter test test/visual/glass_screenshots_test.dart --concurrency=1

      - name: Create a compact review copy of the actual desktop screenshot
        run: python -c "from PIL import Image; Image.open('build/ui-screenshots/desktop.png').convert('RGB').save('build/ui-screenshots/desktop-preview.jpg', quality=90)"

      - name: Upload actual widget screenshots
        uses: actions/upload-artifact@v4
        with:
          name: timesand-ui-cloud-refresh
          path: build/ui-screenshots/*
          if-no-files-found: error
          retention-days: 3

      - name: Publish generated review files with a fast-forward push
        env:
          REFRESH_BRANCH: ${{ github.ref_name }}
          REFRESH_BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$REFRESH_BRANCH" = "feat/glass-hourglass-ui"
          mkdir -p docs/ui
          cp build/ui-screenshots/*.png docs/ui/
          cp build/ui-screenshots/desktop-preview.jpg docs/ui/
          git add lib test pubspec.lock docs/ui assets/scenes
          if git diff --cached --quiet; then
            echo "Review files and Dart formatting already match this commit."
            exit 0
          fi
          git fetch origin "$REFRESH_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$REFRESH_BASE_SHA" ]; then
            echo "::error::The branch advanced during cloud validation. Refusing to overwrite concurrent work; rerun on the latest commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "chore: refresh coastal asset and actual widget previews"
          git push origin "HEAD:$REFRESH_BRANCH"
