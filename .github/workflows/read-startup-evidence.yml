name: Read Android startup evidence
on:
  push:
    branches: [feat/glass-hourglass-ui]
    paths: [.github/workflows/read-startup-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: timesand-android-runtime
          run-id: 39414829927
          github-token: ${{ github.token }}
          path: evidence
      - run: python3 -m pip install Pillow==11.3.0
      - name: Read the actual startup log and screen
        run: |
          python3 - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          for line in Path('evidence/logcat.txt').read_text(errors='replace').splitlines():
              if 'flutter' in line.lower() or 'timesand' in line.lower():
                  print(line)
          print('WINDOW_XML:', Path('evidence/window.xml').read_text())
          image = Image.open('evidence/startup.png').convert('RGB')
          image.thumbnail((540, 960))
          buffer = io.BytesIO()
          image.save(buffer, format='JPEG', quality=80)
          print('TIMESAND_SCREENSHOT_BASE64=' + base64.b64encode(buffer.getvalue()).decode())
          PY
