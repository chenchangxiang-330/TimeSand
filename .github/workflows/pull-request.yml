name: Pull Request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Show Dart formatter diff
        run: |
          dart format lib test
          git diff --no-ext-diff --unified=3 -- lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android host scaffold
        run: flutter create --platforms=android --project-name timesand --org com.timesand --no-pub .

      - name: Build development APK
        run: flutter build apk --debug

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: timesand-android-debug-pr
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  macos:
    name: macOS debug app
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure macOS host scaffold
        run: flutter create --platforms=macos --project-name timesand --org com.timesand --no-pub .

      - name: Build unsigned development app
        run: flutter build macos --debug

      - name: Upload development app
        uses: actions/upload-artifact@v4
        with:
          name: timesand-macos-debug-pr
          path: build/macos/Build/Products/Debug/TimeSand.app
          retention-days: 3
