name: Pull Request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Print Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Install screenshot fonts
        timeout-minutes: 4
        run: |
          # Avoid the runner's intermittently stalled Azure HTTP font mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk fonts-roboto

      - name: Render phone and desktop UI
        env:
          RUN_UI_SCREENSHOTS: 'true'
        run: flutter test test/visual --concurrency=1

      - name: Upload actual widget screenshots
        uses: actions/upload-artifact@v4
        with:
          name: timesand-ui-screenshots
          path: build/ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android debug APK and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android host scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --project-name timesand --org com.timesand --no-pub .

      - name: Build development APK
        run: flutter build apk --debug

      - name: Record the production APK signing certificate
        run: |
          mkdir -p build/android-startup-evidence
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APK_SIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee build/android-startup-evidence/production-certificate.txt

      - name: Preserve the production APK before building integration tests
        run: |
          mkdir -p build/startup-apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/startup-apk/app-debug.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify production APK startup and real SQLite persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash tool/android_runtime_test.sh

      - name: Upload emulator startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timesand-android-runtime
          path: build/android-startup-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: timesand-android-debug-pr
          path: build/startup-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS debug app
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure macOS host scaffold
        run: |
          rm -rf macos
          flutter create --platforms=macos --project-name timesand --org com.timesand --no-pub .

      - name: Build unsigned development app
        run: flutter build macos --debug

      - name: Package and verify macOS app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Debug/TimeSand.app"
          zip_path="build/artifacts/TimeSand-macos-debug.zip"
          test -d "$app_path/Contents"
          test -x "$app_path/Contents/MacOS/TimeSand"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          ditto -x -k "$zip_path" "$extract_dir"
          extracted_app="$extract_dir/TimeSand.app"

          test -d "$extracted_app/Contents"
          test -f "$extracted_app/Contents/Info.plist"
          test -x "$extracted_app/Contents/MacOS/TimeSand"
          symlink_count="$(find "$extracted_app" -type l -print | wc -l | tr -d ' ')"
          test "$symlink_count" -gt 0
          printf 'Verified ZIP: %s\n' "$zip_path"
          printf 'Verified app executable and %s preserved symlink(s).\n' "$symlink_count"
          find "$extracted_app/Contents" -maxdepth 2 -print | sort

      - name: Upload zipped development app
        uses: actions/upload-artifact@v4
        with:
          name: timesand-macos-debug-pr-zip
          path: build/artifacts/TimeSand-macos-debug.zip
          retention-days: 3
