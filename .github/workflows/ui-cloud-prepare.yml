name: Temporary cloud UI preparation
on:
  push:
    branches: [feat/glass-hourglass-ui]
permissions:
  contents: write
concurrency:
  group: glass-ui-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/glass-hourglass-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install artwork and screenshot tooling
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-roboto
      - name: Generate environment asset and format code
        run: |
          python tool/generate_coastal_scene.py
          flutter pub get
          dart format lib test
      - name: Save generated asset, formatting and dependency lock
        run: |
          git add lib test assets pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: prepare cloud artwork and formatted UI sources"
            git push origin HEAD:feat/glass-hourglass-ui
          fi
      - run: flutter analyze
      - run: flutter test
      - name: Render actual Flutter widgets
        env:
          RUN_UI_SCREENSHOTS: 'true'
        run: flutter test test/visual/glass_screenshots_test.dart --concurrency=1
      - name: Preserve review screenshots
        run: |
          mkdir -p docs/ui
          cp build/ui-screenshots/*.png docs/ui/
          git add docs/ui
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: capture implemented phone and desktop Flutter UI"
            git push origin HEAD:feat/glass-hourglass-ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-ui-render-review
          path: build/ui-screenshots/
          if-no-files-found: ignore
          retention-days: 3
