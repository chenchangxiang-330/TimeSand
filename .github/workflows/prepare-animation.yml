name: Prepare and verify sand animation in cloud
on:
  push:
    branches: [feat/hourglass-to-bottle-animation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Format Dart sources in cloud
        run: |
          dart format lib test integration_test test_driver
          git add lib test integration_test test_driver pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "TimeSand cloud validation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format sand flow implementation"
            git push origin HEAD:feat/hourglass-to-bottle-animation
          fi
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded
      - name: Install rendering fonts
        timeout-minutes: 4
        run: |
          # Avoid the runner's intermittently stalled Azure HTTP font mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk fonts-roboto
      - name: Render actual sequence frames
        env:
          RUN_UI_SCREENSHOTS: 'true'
        run: flutter test test/visual --concurrency=1 --reporter expanded
      - name: Generate small previews of actual desktop frames
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tool/render_sand_flow_previews.py
      - name: Preserve actual sequence in repository
        run: |
          mkdir -p docs/animation
          cp build/ui-screenshots/sand-flow-*.png docs/animation/
          cp build/ui-screenshots/sand-flow-*.jpg docs/animation/
          git add docs/animation
          if ! git diff --cached --quiet; then
            git config user.name "TimeSand cloud validation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: capture actual sand flow sequence"
            git push origin HEAD:feat/hourglass-to-bottle-animation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sand-flow-cloud-frames
          path: build/ui-screenshots
          if-no-files-found: warn
          retention-days: 3
