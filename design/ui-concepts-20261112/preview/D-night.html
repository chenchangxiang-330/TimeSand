/* D · 极夜星砂 — original TimeSand theme, no external assets. */
body.theme-night {
  --bg: #101725;
  --surface: #182133;
  --ink: #edf0f7;
  --muted: #a6b4c9;
  --accent: #b4c4f5;
  --line: #334159;
  --soft: #26334b;
  --shadow: 0 20px 70px #060b1638;
  --radius: 24px;
  color-scheme: dark;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 57% 5%, #39466c70, transparent 43%),
    radial-gradient(ellipse at 87% 69%, #40345638, transparent 38%),
    var(--bg);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
.theme-night .app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
.theme-night .sidebar {
  display: flex; flex-direction: column; gap: 32px; width: auto;
  padding: 36px 20px; background: #101827e8;
  border-right: 1px solid #33415980; border-radius: 0;
}
.theme-night .brand { color: #f3f4ff; letter-spacing: .04em; }
.theme-night .brand small { color: #95a8c5; letter-spacing: .18em; }
.theme-night .sidebar nav { display: grid; gap: 9px; }
.theme-night .sidebar nav button {
  color: #aebbd0; border-radius: 13px; padding: 14px 16px;
  background: transparent; border: 1px solid transparent; text-align: left;
}
.theme-night .sidebar nav button.active {
  color: #eff2ff; background: #293650; border-color: #495b7e;
  box-shadow: inset 3px 0 #b4c4f5;
}
.theme-night .side-note { color: #8f9eb6; font-size: 12px; line-height: 2.1; margin-top: auto; }
.theme-night .workspace { min-width: 0; padding: 28px 40px 160px; }
.theme-night .topbar {
  border-bottom: 1px solid #33415980; padding-bottom: 20px;
  margin-bottom: 26px; align-items: center;
}
.theme-night .topbar h1 { font-weight: 500; font-size: 22px; letter-spacing: .04em; }
.theme-night .topbar .date { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.theme-night .hero-grid {
  display: grid; grid-template-columns: minmax(170px, .8fr) minmax(250px, 1.25fr) minmax(180px, .7fr);
  gap: 24px; align-items: center; min-height: 390px; padding: 12px 0 28px;
}
.theme-night .intro { align-self: center; min-width: 0; position: relative; z-index: 1; }
.theme-night .eyebrow { color: #adbfe8; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
.theme-night .intro h2 {
  color: #eef0ff; font-family: "Songti SC", "Noto Serif CJK SC", serif;
  font-weight: 400; font-size: clamp(31px, 3.4vw, 51px); line-height: 1.5; margin: 22px 0;
}
.theme-night .intro p { color: #a4b2c9; font-size: 13px; line-height: 2; max-width: 21em; }
.theme-night .hourglass-stage {
  position: relative; isolation: isolate; display: grid; place-items: center;
  min-width: 0; min-height: 360px; border-radius: 50%;
  background: radial-gradient(ellipse at center, #6073ac24 0, #27375228 42%, transparent 69%);
}
.theme-night .hourglass-stage::before {
  content: ""; position: absolute; inset: 4% 0; z-index: -1; border-radius: 50%;
  border: 1px solid #7186b324;
  background:
    radial-gradient(circle at 21% 24%, #d9e3ff 0 1px, transparent 2px),
    radial-gradient(circle at 83% 41%, #c5d2f8 0 1px, transparent 2px),
    radial-gradient(circle at 28% 74%, #a5b6dd 0 1px, transparent 2px);
}
.theme-night .hourglass-stage::after {
  content: ""; position: absolute; inset: 12% 8%; border: 1px dashed #7186b31b;
  border-radius: 50%; pointer-events: none; z-index: -1;
}
.theme-night svg.hourglass { width: min(230px, 76%); height: 300px; filter: drop-shadow(0 0 19px #d3ddff1f); }
.theme-night .hero-caption { color: #9aaccd; font-size: 11px; letter-spacing: .08em; text-align: center; }
.theme-night .day-summary {
  min-width: 0; padding: 22px 0 22px 24px;
  background: transparent; border: 0; border-left: 1px solid #60708f70;
  border-radius: 0; box-shadow: none;
}
.theme-night .day-summary .metric {
  font-size: clamp(28px, 3vw, 42px); color: #f1f3ff;
  font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: -.04em;
}
.theme-night .day-summary small { color: #a9b7d0; }
.theme-night progress { accent-color: #bdc9eb; height: 4px; }
.theme-night .bottle-section {
  padding: 24px; border: 1px solid #41516a80; border-radius: 24px;
  background: linear-gradient(120deg, #25314b87, #182133c4); box-shadow: none;
}
.theme-night .section-head { align-items: center; gap: 12px; padding-bottom: 20px; }
.theme-night .section-head h2 { font-size: 17px; font-weight: 500; letter-spacing: .06em; }
.theme-night .section-head p, .theme-night .section-head small { color: #a7b6ce; font-size: 12px; }
.theme-night .bottle-grid {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr);
  gap: 12px; overflow-x: auto; padding: 8px 2px 16px; scrollbar-color: #5b6a87 transparent;
}
.theme-night .bottle-card {
  min-width: 150px; border: 1px solid #48597350; border-radius: 18px;
  background: #101a2b85; box-shadow: none; transition: border-color .2s, background .2s;
}
.theme-night .bottle-card.selected, .theme-night .bottle-card.active {
  background: #2c3c5880; border-color: #a7bce5;
  box-shadow: 0 0 26px #afc4ff14, inset 0 1px #d9e5ff30;
}
.theme-night .bottle-body { color: var(--ink); padding: 16px 12px 8px; background: transparent; width: 100%; }
.theme-night .vessel { height: 119px; max-width: 100%; filter: drop-shadow(0 10px 13px #0004); }
.theme-night .bottle-card h3 { font-weight: 500; font-size: 14px; margin: 12px 0 8px; overflow-wrap: anywhere; }
.theme-night .bottle-time { color: #bac8e1; font-size: 12px; font-variant-numeric: tabular-nums; }
.theme-night .card-controls { border-top: 1px solid #48597350; padding: 11px; }
.theme-night .card-controls button { min-height: 40px; color: #d5dff6; background: #28354b; }
.theme-night .ocean-card {
  position: relative; overflow: hidden; margin-top: 22px; padding: 26px 28px;
  background: linear-gradient(115deg, #213f58, #1d2946); border: 1px solid #49617f;
  border-radius: 24px; color: #e5f1ff;
}
.theme-night .ocean-copy { position: relative; z-index: 1; color: #bed1e3; }
.theme-night .ocean-value { color: #f1f6ff; font-size: 32px; letter-spacing: -.04em; }
.theme-night .wave { opacity: .28; }
.theme-night .panel, .theme-night .stat-card {
  background: #192438dc; border: 1px solid #3d506a; box-shadow: none; border-radius: 20px;
}
.theme-night .record-row { border-bottom-color: #3a4962; background: transparent; }
.theme-night .toolbar { gap: 12px; flex-wrap: wrap; }
.theme-night .chart-bar { background: #acbee6; border-radius: 4px 4px 0 0; }
.theme-night .setting-row { border-bottom: 1px solid #3a4962; padding-block: 19px; }
.theme-night .primary { background: #c6d4f8; color: #14213a; border: 1px solid #d8e2ff; font-weight: 600; box-shadow: none; }
.theme-night .secondary, .theme-night .icon-btn { background: #23314a; color: #e1e9ff; border: 1px solid #4a5b79; }
.theme-night button:hover { filter: brightness(1.1); }
.theme-night :is(button, a, input, select, textarea):focus-visible { outline: 3px solid #d1d8ff; outline-offset: 4px; }
.theme-night :is(input, select, textarea) { background: #111b2d; color: #edf2ff; border: 1px solid #647491; border-radius: 10px; }
.theme-night dialog { background: #1b273b; color: #edf2ff; border: 1px solid #647491; border-radius: 24px; box-shadow: 0 30px 100px #0009; }
.theme-night dialog::backdrop { background: #050912bc; backdrop-filter: blur(4px); }
.theme-night dialog label { color: #c1cde1; }
.theme-night .timer-bar {
  left: 230px; right: 30px; bottom: 20px; max-width: none;
  color: #eaf0ff; background: #23314beF; border: 1px solid #768aaa;
  box-shadow: 0 12px 40px #0005; border-radius: 18px;
}
.theme-night .bottom-nav { background: #18233ced; border: 1px solid #4b607e; box-shadow: 0 10px 35px #0006; }
.theme-night .bottom-nav button { color: #a7b6cf; }
.theme-night .bottom-nav button.active { color: #f1f4ff; background: #3a4e73; }
@media (min-width: 1450px) {
  .theme-night .workspace { padding-inline: 64px; }
  .theme-night .hero-grid { min-height: 430px; gap: 42px; }
  .theme-night svg.hourglass { height: 330px; }
}
@media (max-width: 1049px) {
  .theme-night .app { display: block; }
  .theme-night .sidebar { display: none; }
  .theme-night .workspace { padding: 24px 24px 180px; }
  .theme-night .timer-bar { left: 20px; right: 20px; bottom: 88px; }
  .theme-night .hero-grid { grid-template-columns: minmax(140px, .8fr) minmax(220px, 1.2fr) minmax(160px, .8fr); gap: 16px; }
}
@media (max-width: 700px) {
  .theme-night .workspace { padding: 18px 16px 185px; }
  .theme-night .topbar { margin-bottom: 10px; padding-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .theme-night .hero-grid { display: flex; flex-direction: column; min-height: 0; gap: 12px; padding: 14px 0 22px; }
  .theme-night .intro { text-align: center; width: 100%; }
  .theme-night .intro h2 { font-size: clamp(28px, 8vw, 36px); margin: 9px 0; line-height: 1.35; }
  .theme-night .intro p { max-width: 28em; margin: 8px auto; font-size: 12px; }
  .theme-night .hourglass-stage { width: min(310px, 100%); min-height: 280px; }
  .theme-night svg.hourglass { height: 236px; }
  .theme-night .day-summary { width: 100%; padding: 18px 20px; border: 1px solid #4b5d7a80; border-radius: 18px; background: #26355070; }
  .theme-night .day-summary .metric { font-size: 29px; }
  .theme-night .bottle-section { padding: 18px 14px; border-radius: 22px; }
  .theme-night .section-head { flex-wrap: wrap; padding-bottom: 12px; }
  .theme-night .bottle-grid { grid-auto-columns: 150px; }
  .theme-night .ocean-card { padding: 22px; }
  .theme-night .timer-bar { left: 12px; right: 12px; bottom: 88px; }
  .theme-night .stat-grid, .theme-night .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .theme-night .record-row { gap: 10px; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  .theme-night *, .theme-night *::before, .theme-night *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style></head><body><script>window.TIMESAND_CONFIG={"id":"night","code":"D","name":"极夜星砂","headline":"收起喧嚣，<br>让这一刻发光。","eyebrow":"A CONSTELLATION OF MOMENTS","description":"深午夜蓝、暖白沙粒和环形舞台。中央沙漏与活动状态更突出，数据放在安静的侧列；适合夜间、专注时使用，保持足够文字对比。","reference":"借鉴番茄 ToDo 的单一计时焦点与小日常的深色方向，视觉为原创。"};</script><script>(function prototypeApp(){

const icons={home:'<path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z"/>',bottles:'<path d="M8 3h8M9 3v5c0 3-5 3-5 8a8 8 0 0 0 16 0c0-5-5-5-5-8V3"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',stats:'<path d="M4 20V12h4v8m2 0V4h4v16m2 0V8h4v12"/>',settings:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>'};

document.body.className='theme-'+C.id;

function render(){ $('#sideNav').innerHTML=nav();$('#bottomNav').innerHTML=nav(true);let title={home:'今日时光',bottles:'时间瓶子',history:'时光记录',stats:'投入与成长',settings:'我的与数据',detail:'永久成长瓶'}[page];$('#pageTitle').innerHTML=`${title} <span class="preview-label">交互原型 · 演示数据</span>`;$('#content').innerHTML=page==='home'?home():page==='bottles'?bottlesPage():page==='history'?history():page==='stats'?stats():page==='detail'?detail():settings();renderTimer();tick();smoothCorners();}
function shelf(){const bs=state.bottles.filter(b=>!b.archived);return `<section class="bottle-section"><div class="section-head"><div><h3>今日 · 时间之瓶</h3><p>点击瓶身查看累计，播放键开始投入</p></div><button data-act="new-bottle">＋ 新建</button></div><div class="bottle-grid" id="bottleShelf">${bs.length?bs.map(b=>`<article class="bottle-card ${state.selected===b.id?'selected':''} ${active()?.bottleId===b.id?'receiving':''}" style="--bottle-color:${b.color}"><button class="bottle-body" data-act="detail" data-id="${b.id}" aria-label="查看${esc(b.name)}累计">${vessel(b)}<h3>${esc(b.name)}</h3><div class="bottle-time" data-today="${b.id}"></div></button><div class="card-controls"><button data-act="select" data-id="${b.id}" class="${state.selected===b.id?'on':''}" aria-label="选择${esc(b.name)}">${state.selected===b.id?'已选':'选择'}</button><button data-act="start" data-id="${b.id}" aria-label="开始${esc(b.name)}" ${active()?.bottleId===b.id?'disabled':''}>▶</button><button data-act="edit-bottle" data-id="${b.id}" aria-label="管理${esc(b.name)}">···</button></div></article>`).join(''):`<div class="empty"><h3>给时间一个去处</h3><p>创建第一只瓶子，开始记录真正重要的事。</p><button class="primary" data-act="new-bottle">创建时间瓶</button></div>`}</div><p class="bottle-caption">瓶内比例表示今日已记录时间的分配，不代表目标完成率。</p></section>`;}

function stats(){const s=dayStats();return `<section class="page"><div class="panel"><div class="eyebrow">SMALL MOMENTS, LASTING GROWTH</div><h2>时间留下了形状。</h2><p class="muted">每日瓶看今天，成长瓶看一路走来的投入。</p><div class="stat-grid"><div class="stat-card"><small>今日已记录</small><div class="metric">${fmt(s.allocated)}</div></div><div class="stat-card"><small>今日未分配</small><div class="metric">${fmt(s.ocean)}</div></div><div class="stat-card"><small>全部历史累计</small><div class="metric">${fmt(total())}</div></div></div><h3>最近 7 天</h3>${chart()}<h3 style="margin-top:30px">永久成长瓶</h3>${state.bottles.map(b=>`<div class="setting-row"><div><i class="dot" style="display:inline-block;background:${b.color}"></i> ${esc(b.name)} <small>${fmt(total(b.id))} · ${state.entries.filter(e=>e.bottleId===b.id).length} 段记录</small></div><button data-act="detail" data-id="${b.id}">查看</button></div>`).join('')}</div></section>`;}
function detail(){let b=bottle(detailId);return `<section class="page"><button data-page="bottles" class="secondary" style="margin-bottom:20px">← 返回时间瓶</button><div class="panel"><div class="detail-grid"><div>${vessel(b,true)}</div><div><div class="eyebrow">PERMANENT GROWTH</div><h2>${esc(b.name)}</h2><p class="muted">永久成长瓶 · ${b.archived?'已归档':'持续生长'}</p><div class="metric" style="margin:20px 0">${fmt(total(b.id))}</div><p class="muted">今日投入 <span data-today="${b.id}"></span></p><div class="row" style="margin-top:18px">${!b.archived?`<button class="primary" data-act="start" data-id="${b.id}">为它投入时间</button><button data-act="edit-bottle" data-id="${b.id}">管理瓶子</button>`:''}</div></div></div>${chart(b.id)}<h3>历史投入</h3>${rows(state.entries.filter(e=>e.bottleId===b.id).sort((a,b)=>b.start-a.start))}</div></section>`;}
function settings(){return `<section class="page settings-grid"><div class="panel"><h2>只属于你的时光。</h2><p class="muted">本地记录，无账户与云端同步。</p><div class="setting-row"><div>减少装饰动画<small>静态流向提示，计时照常进行。</small></div><input id="reduceMotion" aria-label="减少动画" type="checkbox" ${state.reduced?'checked':''}></div><div class="setting-row"><div>时间瓶管理<small>查看、编辑、归档与永久累计。</small></div><button data-page="bottles">打开</button></div><div class="setting-row"><div>体验空数据状态<small>只清空本方案的浏览器演示数据。</small></div><button data-act="empty">预览</button></div><div class="setting-row"><div>恢复演示样本<small>不读取或修改 App 数据库。</small></div><button data-act="reset">恢复</button></div></div><div class="panel"><h3>本地数据与恢复 <span class="badge">独立 PR #3</span></h3><p class="muted" style="font-size:12px;margin-top:10px">备份入口来自已实现、尚未合并的 Phase 2.1。本 HTML 仅演示流程；预览文件不能恢复 App 数据库。</p><div class="setting-row"><div>JSON 预览备份<small>本页面的瓶子、记录和活动计时。</small></div><button data-act="export-json">导出</button></div><div class="setting-row"><div>CSV 记录表<small>使用 UTC 起止时间。</small></div><button data-act="export-csv">导出</button></div><div class="setting-row"><div>导入预览文件<small>先验证、预览，再合并或确认覆盖。</small></div><button data-act="import">选择文件</button></div><input type="file" id="importFile" accept=".json,application/json" hidden><div class="setting-row"><div>本方案反馈<small>喜欢的地方、需要调整的细节。</small></div><button data-act="feedback">填写</button></div></div></section>`;}
function renderTimer(){const e=active(),b=bottle(e?.bottleId??state.selected);$('#timerBar').innerHTML=`<div><small>${e?'正在投入':'把下一刻，留给'} · ${esc(b?.name||'一件重要的事')}</small><strong id="activeDuration">${e?clock(Date.now()-e.start):'今天的微小投入，也会被记住。'}</strong></div><button class="primary" data-act="${e?'stop':'start-selected'}">${e?'■ 停止记录':'▶ 开始记录'}</button>`;if(e){flowTarget=e.bottleId;flowDrain=null;}else if(flowTarget&&!flowDrain)flowDrain=performance.now();}
function tick(){const s=dayStats();$('#dateLine').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+' · '+C.name;const vals={allocated:fmt(s.allocated),elapsed:clock(s.elapsed),left:clock(s.left),ocean:fmt(s.ocean),percent:(s.progress*100).toFixed(1)+'%'};$$('[data-live]').forEach(x=>x.textContent=vals[x.dataset.live]);$$('[data-today]').forEach(x=>x.textContent=fmt(total(+x.dataset.today,s.s,Date.now())));$('#dayProgress')&&($('#dayProgress').value=s.progress);if($('#topSand')){$('#topSand').setAttribute('d',`M24 ${22+90*s.progress} Q100 ${32+90*s.progress} 176 ${22+90*s.progress} V135H24Z`);$('#bottomSand').setAttribute('d',`M22 268 L100 ${263-68*s.progress} L178 268Z`);}$$('[data-liquid]').forEach(x=>{let share=s.allocated?total(+x.dataset.liquid,s.s,Date.now())/s.allocated:0,y=128-share*68;x.setAttribute('y',y);x.setAttribute('height',140-y);});$$('[data-surface]').forEach(x=>{let share=s.allocated?total(+x.dataset.surface,s.s,Date.now())/s.allocated:0;x.setAttribute('cy',128-share*68);});const a=active();if(a&&$('#activeDuration'))$('#activeDuration').textContent=clock(Date.now()-a.start);}
function go(p){page=p;particles=[];render();window.scrollTo({top:0,behavior:state.reduced?'instant':'smooth'});}
function openModal(title,html,action,label='保存'){const m=$('#modal');m.innerHTML=`<form id="dialogForm"><h2>${title}</h2>${html}<div class="error" id="formError" role="alert"></div><div class="dialog-actions"><button type="button" data-act="close">取消</button>${action?`<button class="primary" type="submit">${label}</button>`:''}</div></form>`;submitAction=action;m.showModal();smoothCorners();}
function confirmModal(title,text,action,label='确认'){openModal(title,`<p>${esc(text)}</p>`,()=>{action();},label);}
function validate(es,bs){const ids=new Set(bs.map(b=>b.id));if(ids.size!==bs.length)throw Error('瓶子 ID 重复。');bs.forEach(b=>{if(!Number.isInteger(b.id)||!b.name?.trim()||!/^#[0-9a-f]{6}$/i.test(b.color))throw Error('瓶子格式不正确。');});let sorted=[...es].sort((a,b)=>a.start-b.start),seen=new Set();for(let i=0;i<sorted.length;i++){let e=sorted[i];if(seen.has(e.id)||!ids.has(e.bottleId)||!Number.isFinite(e.start)||e.start>Date.now()||(e.end!==null&&(!Number.isFinite(e.end)||e.end<=e.start||e.end>Date.now()))||!['active','manual'].includes(e.source))throw Error('记录格式、起止时间或瓶子引用不正确。');seen.add(e.id);if(i&&e.start<(sorted[i-1].end??Infinity))throw Error('时间记录发生重叠，请调整起止时间。');}}
const uid=()=>Math.max(Date.now(),...state.entries.map(e=>e.id),...state.bottles.map(b=>b.id))+1;
function start(id){const b=bottle(id);if(!b||b.archived){openModal('选择时间之瓶',state.bottles.filter(b=>!b.archived).map(b=>`<button style="width:100%;margin:6px 0" type="button" data-act="choose-start" data-id="${b.id}">${esc(b.name)}</button>`).join('')||'<p>请先创建一只时间瓶。</p><button type="button" data-act="new-bottle">创建时间瓶</button>',null);return;}let current=active();if(current?.bottleId===id){toast('这只瓶子正在计时。');return;}const commit=()=>{let t=Date.now(),es=state.entries.map(e=>e.id===current?.id?{...e,end:t}:e);es.push({id:uid(),bottleId:id,start:t,end:null,source:'active'});validate(es,state.bottles);state.entries=es;state.selected=id;save();render();toast(current?'已结束上一段，开始新的投入。':'开始记录，时间正在流向 '+b.name);};if(current)confirmModal('切换正在投入的瓶子？',`将结束「${bottle(current.bottleId).name}」并开始「${b.name}」，已有时间会保留。`,commit,'结束并切换');else commit();}
function bottleForm(id){let b=bottle(id);openModal(b?'管理时间瓶':'新建时间瓶',`<label>名称<input name="name" maxlength="60" required value="${esc(b?.name||'')}" placeholder="例如：认真阅读"></label><label>瓶子颜色<input name="color" type="color" value="${b?.color||'#508fab'}"></label>${b?'<button type="button" data-act="archive" data-id="'+b.id+'">归档此瓶子</button>':''}`,data=>{const name=data.get('name').trim();if(!name)throw Error('请填写瓶子名称。');if(b){b.name=name;b.color=data.get('color');}else{const n={id:uid(),name,color:data.get('color')};state.bottles.push(n);state.selected=n.id;}save();render();});}
function entryForm(id){let e=state.entries.find(e=>e.id===id);if(e?.end===null){toast('请先停止活动计时，再编辑。');return;}if(!state.bottles.length){toast('请先创建时间瓶。');return;}let n=Date.now(),start=e?.start??Math.max(+day(new Date()),n-30*60000);openModal(e?'编辑时间记录':'补记一段时光',`<label>时间瓶<select name="bottleId">${options(e?.bottleId??state.selected,false)}</select></label><label>开始时间<input name="start" type="datetime-local" step="1" required value="${local(new Date(start))}"></label><label>结束时间<input name="end" type="datetime-local" step="1" required value="${local(new Date(e?.end??n))}"></label><p>按设备本地时区输入，不能和已有记录重叠。</p>`,data=>{let item={id:e?.id??uid(),bottleId:+data.get('bottleId'),start:+new Date(data.get('start')),end:+new Date(data.get('end')),source:e?.source??'manual'},es=[...state.entries.filter(x=>x.id!==e?.id),item];validate(es,state.bottles);state.entries=es;save();render();toast('记录已保存，统计已重新计算。');});}
function download(name,text,type='application/json'){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){return {preview_format:1,notice:'HTML UI preview only; not a TimeSand SQLite backup',exported_at:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,bottles:state.bottles,entries:state.entries};}
function feedback(){openModal('记录你的选择',`<p>${C.code} · ${C.name}。反馈仅下载到你选择的位置，不会自动发送。</p><label>整体感受<select name="rating"><option>很喜欢，优先考虑</option><option>方向合适，需要微调</option><option>不适合我的使用习惯</option></select></label><label>希望保留或调整什么？<textarea name="comment" placeholder="例如：喜欢连续圆角，希望瓶子更大、文字更清楚。"></textarea></label>`,data=>{download('TimeSand-方案'+C.code+'-反馈.txt',`方案：${C.code} ${C.name}\n感受：${data.get('rating')}\n反馈：${data.get('comment')}\n时间：${new Date().toLocaleString('zh-CN')}`,'text/plain');toast('反馈已生成，可回到对话发送。');},'下载反馈');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}const a=b.dataset.act,id=+b.dataset.id;try{if(a==='close')$('#modal').close();if(a==='new-bottle'){if($('#modal').open)$('#modal').close();bottleForm();}if(a==='edit-bottle')bottleForm(id);if(a==='select'){state.selected=id;save();render();}if(a==='detail'){detailId=id;go('detail');}if(a==='start')start(id);if(a==='start-selected')start(state.selected);if(a==='choose-start'){$('#modal').close();start(id);}if(a==='stop'){const e=active();if(e){e.end=Math.max(Date.now(),e.start+1);save();render();toast('已保存这段投入，沙粒正在落完。');}}if(a==='archive'){const b=bottle(id);if(active()?.bottleId===id){$('#formError').textContent='正在计时，请先停止再归档。';return;}$('#modal').close();confirmModal('归档时间瓶？','历史记录和永久累计会保留，瓶子从首页收起。',()=>{b.archived=true;state.selected=state.bottles.find(x=>!x.archived)?.id;save();render();},'归档');}if(a==='manual')entryForm();if(a==='edit-entry')entryForm(id);if(a==='delete-entry')confirmModal('删除这段记录？','删除后每日瓶、永久累计和海洋会立即重新计算。',()=>{state.entries=state.entries.filter(e=>e.id!==id);save();render();},'确认删除');if(a==='clear-filter'){filterDate='';filterMonth='';filterBottle='';render();}if(a==='calendar'){filterDate=dateKey(new Date());filterMonth='';go('history');$('#filterDate').focus();}if(a==='feedback')feedback();if(a==='empty'||a==='reset')confirmModal(a==='empty'?'体验空数据？':'恢复演示样本？','只改变当前 HTML 的浏览器演示数据，不影响 App。',()=>{state=a==='empty'?{bottles:[],entries:[],reduced:state.reduced}:seed();save();go('home');});if(a==='about')openModal('方案 '+C.code+' · '+C.name,`<p>${C.description}</p><p>统一采用连续曲率圆角；卡片、按钮、弹窗与导航共享轮廓。此为原创 HTML 交互原型，使用独立浏览器演示数据，不连接 App SQLite。</p><p>功能基线：PR #5 的计时、瓶子、历史、统计与流沙。备份流程单独标注 PR #3；没有新增账户或同步。</p>`,null);if(a==='export-json')download('TimeSand-preview-'+C.id+'.json',JSON.stringify(backup(),null,2));if(a==='export-csv'){let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('TimeSand-preview-records.csv','\ufeff'+['entry_id,bottle_id,bottle_name,started_at,ended_at,duration_seconds,source',...state.entries.map(e=>[e.id,e.bottleId,bottle(e.bottleId).name,new Date(e.start).toISOString(),e.end?new Date(e.end).toISOString():'',e.end?Math.floor((e.end-e.start)/1000):'',e.source].map(q).join(','))].join('\r\n'),'text/csv');}if(a==='import')$('#importFile').click();}catch(e){toast(e.message);}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='dialogForm')return;ev.preventDefault();try{submitAction?.(new FormData(ev.target));$('#modal').close();}catch(e){$('#formError').textContent=e.message;}});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='filterDate'){filterDate=t.value;filterMonth='';render();}if(t.id==='filterMonth'){filterMonth=t.value;filterDate='';render();}if(t.id==='filterBottle'){filterBottle=t.value;render();}if(t.id==='reduceMotion'){state.reduced=t.checked;particles=[];save();}if(t.id==='importFile'&&t.files[0]){try{let f=t.files[0];if(f.size>1024*1024)throw Error('预览文件超过 1 MiB，请换一个文件。');let data=JSON.parse(await f.text());if(data.preview_format!==1||!Array.isArray(data.bottles)||!Array.isArray(data.entries))throw Error('不是有效的 HTML 预览备份。请勿导入 App 备份。');validate(data.entries,data.bottles);openModal('导入预览',`<p>${data.bottles.length} 只瓶子 · ${data.entries.length} 段记录。文件已通过区间与引用校验。</p><label>方式<select name="mode"><option value="merge">合并（保留已有演示数据）</option><option value="replace">覆盖当前演示数据</option></select></label><label>选择覆盖时，请输入“覆盖”确认<input name="confirm" placeholder="仅覆盖模式需要"></label>`,form=>{if(form.get('mode')==='replace'){if(form.get('confirm')!=='覆盖')throw Error('请输入“覆盖”以确认恢复。');state={...state,bottles:data.bottles,entries:data.entries,selected:data.bottles.find(b=>!b.archived)?.id};}else{let n=uid(),map=new Map(),bs=data.bottles.map(b=>{map.set(b.id,n);return {...b,id:n++};}),es=data.entries.map(e=>({...e,id:n++,bottleId:map.get(e.bottleId)})),all=[...state.entries,...es];validate(all,[...state.bottles,...bs]);state.bottles.push(...bs);state.entries=all;}save();render();toast('预览数据已导入。');},'导入');}catch(e){toast('导入拒绝：'+e.message);}t.value='';}});
function smoothCorners(){if(!new URLSearchParams(location.search).has('fallback')&&CSS.supports('corner-shape','superellipse(1.5)'))return;cornerObserver.disconnect();$('.panel,.day-summary,.bottle-section,.ocean-card,.stat-card,.timer-bar,.bottom-nav,.bottle-card,dialog,button').forEach(el=>cornerObserver.observe(el));}
const cornerObserver=new ResizeObserver(es=>es.forEach(({target:el})=>{const w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;let r=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||22,w/2,h/2);let p=`M ${r} 0 H ${w-r} C ${w} 0 ${w} 0 ${w} ${r} V ${h-r} C ${w} ${h} ${w} ${h} ${w-r} ${h} H ${r} C 0 ${h} 0 ${h} 0 ${h-r} V ${r} C 0 0 0 0 ${r} 0 Z`;el.style.clipPath=`path('${p}')`;}));
const canvas=$('#sandFlow'),ctx=canvas.getContext('2d');let w=0,h=0;
function flow(t){requestAnimationFrame(flow);if(w!==innerWidth||h!==innerHeight){w=innerWidth;h=innerHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}ctx.clearRect(0,0,w,h);let dt=Math.min((t-lastFrame)/1000,.05);lastFrame=t;if(document.hidden||page!=='home') {particles=[];return;}let source=$('#mainHourglass'),target=$(`#bottleShelf [data-vessel="${flowTarget}"]`);if(!source||!target){particles=[];return;}let s=source.getBoundingClientRect(),b=target.getBoundingClientRect(),shelf=$('#bottleShelf').getBoundingClientRect();const start={x:s.x+s.width*.5,y:s.y+s.height*.982},end={x:b.x+b.width*.5,y:b.y+b.height*.122};if(start.y<0||start.y>h-160||end.x<shelf.left||end.x>shelf.right||end.y<0||end.y>h-150){particles=[];return;}let reduced=state.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches,col=bottle(flowTarget)?.color||'#63a3b2';function pos(p){let lane=Math.min(shelf.left-7,start.x-10),y=Math.max(start.y+8,end.y-13);if(p<.4){let q=p/.4;return {x:start.x+(lane-start.x)*(q*q*(3-2*q)),y:start.y+8*q};}if(p<.75){let q=(p-.4)/.35;return {x:lane,y:start.y+8+(y-start.y-8)*q};}let q=(p-.75)/.25;return {x:lane+(end.x-lane)*(1-Math.pow(1-q,3)),y:y+(end.y-y)*q*q};}
if(reduced){particles=[];if(active()){for(let i=0;i<32;i++){let p=pos(i/31);ctx.fillStyle=i<23?'#c5b799':col;ctx.beginPath();ctx.arc(p.x,p.y,1.1,0,7);ctx.fill();}}return;}if(active()&&particles.length<110){for(let i=0;i<2;i++)particles.push({age:0,life:1.5+(Math.random()*.25),seed:Math.random()});}particles.forEach(p=>p.age+=dt);particles=particles.filter(p=>p.age<p.life);for(const p of particles){let f=p.age/p.life,x,y;if(f<.78){let point=pos(f/.78);x=point.x+Math.sin(f*30+p.seed)*1.2;y=point.y;}else{let f2=(f-.78)/.22,cy=Number(target.querySelector('[data-surface]')?.getAttribute('cy')||125);x=end.x+Math.sin(f2*12)*1.5;y=end.y+(b.height*(cy-17)/140)*f2;}ctx.fillStyle=f<.56?(C.id==='night'?'#f9f3d5':'#c3ad7c'):col;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(x,y,.7+p.seed*.8,0,7);ctx.fill();}ctx.globalAlpha=1;if(flowDrain&&t-flowDrain>1900){particles=[];flowTarget=null;flowDrain=null;}}
save();render();setInterval(()=>{tick();},1000);requestAnimationFrame(flow);
window.__preview={getState:()=>JSON.parse(JSON.stringify(state)),total,dayStats,validate,go};
})();</script></body></html>
